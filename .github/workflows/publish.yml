name: Publish

# npm Trusted Publishing can only be configured after a package exists. For the first
# release, set a short-lived NPM_TOKEN repository secret and let this same workflow do
# the publish. The token is optional: after Trusted Publishing is configured, remove it
# and npm 11 will authenticate through this job's OIDC token instead. Both paths publish
# from GitHub Actions with public access and npm provenance.

on:
  push:
    tags: ['*.*.*']

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'sentdm/n8n-nodes-sent'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # Third-party actions are pinned to commit SHAs: this job holds `id-token: write`
      # and publishes to npm, so a retagged `@v4` would be a direct supply-chain path.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Deliberately no `registry-url`. It makes setup-node write an .npmrc containing
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and set NODE_AUTH_TOKEN to the literal
      # placeholder `XXXXX-XXXXX-XXXXX-XXXXX` when no real token is supplied. npm then sees a
      # credential, never attempts OIDC, and the registry rejects the junk token as
      # `404 Not Found - PUT`. That is what broke the first Trusted Publishing release of 0.1.1.
      # npm defaults to registry.npmjs.org anyway, and the bootstrap-token path below sets its own
      # authToken, so neither path needs this input.
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Use an npm version that supports Trusted Publishing
        run: npm install --global npm@11.19.0

      - name: Clean install
        run: npm ci

      - name: Require an exact package-version tag
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "$package_version" != "$GITHUB_REF_NAME" ]; then
            echo "package.json version $package_version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if npm view "@sentdm/n8n-nodes-sent@$package_version" version >/dev/null 2>&1; then
            echo "@sentdm/n8n-nodes-sent@$package_version already exists; refusing to republish" >&2
            exit 1
          fi

      - name: Test
        run: npm test

      # `n8n-node release` runs lint and build itself when GITHUB_ACTIONS is set, and its
      # build starts with `rimraf('dist')`. Repeating lint/build/`npm pack --dry-run` here
      # would inspect an artifact that is deleted and rebuilt before publish, so it is not
      # repeated. Note this means the packed-contents inspection and the tracked-artifact
      # scan live only in CI: tag a commit that CI has run on.
      - name: Publish with provenance
        env:
          # Temporary bootstrap fallback, following the official n8n starter workflow.
          # Leave unset for normal OIDC Trusted Publisher releases.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          NPM_CONFIG_ACCESS: public
        shell: bash
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm run release

      # npm's packument lags the publish itself. The scanner fetches the packument and reports a
      # bare 404 as "Analysis failed: Request failed with status code 404", which is
      # indistinguishable from a real security failure. On the 0.1.0 first publish the version
      # document served correct metadata immediately while the packument 404'd for about 3.5
      # minutes. Wait for the packument to actually list this version before scanning: for a second
      # and later release the packument already exists and returns 200 at once, so checking only the
      # status code would not wait for anything.
      - name: Wait for the published version to appear in the npm packument
        shell: bash
        run: |
          packument='https://registry.npmjs.org/@sentdm%2Fn8n-nodes-sent'
          for attempt in $(seq 1 30); do
            if curl -sS -H 'Cache-Control: no-cache' "$packument" \
              | node -e 'let s="";process.stdin.on("data",d=>{s+=d}).on("end",()=>{try{process.exit(JSON.parse(s).versions?.[process.argv[1]]?0:1)}catch{process.exit(1)}})' "$GITHUB_REF_NAME"; then
              echo "packument lists $GITHUB_REF_NAME after $attempt attempt(s)"
              exit 0
            fi
            echo "packument does not list $GITHUB_REF_NAME yet (attempt $attempt); waiting"
            sleep 20
          done
          echo "npm packument never listed $GITHUB_REF_NAME. The publish may still have succeeded: check the publish step log and re-run the scanner manually rather than re-running this job, which refuses to republish." >&2
          exit 1

      - name: Scan published package
        shell: bash
        run: |
          scan_output="$(npx --yes @n8n/scan-community-package@0.31.0 "@sentdm/n8n-nodes-sent@$GITHUB_REF_NAME" 2>&1)"
          printf '%s\n' "$scan_output"
          if ! grep -q 'has passed all security checks' <<< "$scan_output"; then
            echo 'Published package did not pass the n8n community scanner.' >&2
            exit 1
          fi
