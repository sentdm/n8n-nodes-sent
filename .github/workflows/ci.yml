name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Lint and type-check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Inspect package
        run: npm pack --dry-run

      - name: Check tracked files for unsafe repository artifacts
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|(^|/)coverage/|(^|/)node_modules/|(^|/)dist/' ; then
            echo 'Tracked local/generated artifact detected.' >&2
            exit 1
          fi
          if git grep -nE 'NODE_TLS_REJECT_UNAUTHORIZED|rejectUnauthorized[[:space:]]*:[[:space:]]*false|process\.env|child_process|eval\(' -- credentials nodes package.json ; then
            echo 'Potentially unsafe runtime construct detected.' >&2
            exit 1
          fi

      - name: Scanner mode notice
        run: echo 'The official scanner downloads a published npm package; the exact version is scanned after publication in publish.yml.'
